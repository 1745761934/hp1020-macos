name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每月跑一次，捕捉依赖漂移
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 脚本与固件检查 —— 纯 Linux，无需 macOS runner
  # ---------------------------------------------------------------------------
  verify-firmware:
    name: 固件完整性校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 md5 与大小
        run: |
          set -euo pipefail
          EXPECT_MD5="0cd1ac3a4f6cb7995e99deffff840927"
          EXPECT_SIZE=128999
          FW="fw/sihp1020.dl"

          [ -f "$FW" ] || { echo "缺少 $FW"; exit 1; }

          ACTUAL_MD5=$(md5sum "$FW" | cut -d' ' -f1)
          ACTUAL_SIZE=$(stat -c%s "$FW")

          echo "md5  : $ACTUAL_MD5"
          echo "size : $ACTUAL_SIZE"

          [ "$ACTUAL_MD5" = "$EXPECT_MD5" ] || {
            echo "md5 不符，期望 $EXPECT_MD5"; exit 1; }
          [ "$ACTUAL_SIZE" = "$EXPECT_SIZE" ] || {
            echo "大小不符，期望 $EXPECT_SIZE"; exit 1; }

          echo "固件校验通过"

      - name: 格式自检
        run: |
          set -euo pipefail
          chmod +x scripts/hp1020-fwinspect
          python3 scripts/hp1020-fwinspect fw/sihp1020.dl
          python3 scripts/hp1020-fwinspect --json fw/sihp1020.dl
          python3 scripts/hp1020-fwinspect fw/sihp1020.dl >/dev/null
          echo "格式判定 GOOD"

  test-inspector:
    name: 固件检测器回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 各类错误格式判定
        run: |
          set -euo pipefail
          chmod +x scripts/hp1020-fwinspect
          INS="$PWD/scripts/hp1020-fwinspect"
          TMP=$(mktemp -d)
          cd "$TMP"

          GOOD="$GITHUB_WORKSPACE/fw/sihp1020.dl"

          # 1. 正确固件 -> GOOD, exit 0
          cp "$GOOD" correct.dl
          "$INS" correct.dl >/dev/null || { echo "FAIL: 正确固件应 GOOD"; exit 1; }
          echo "PASS: 正确固件 -> GOOD"

          # 2. 裸 ELF -> BARE_ELF, exit 1
          python3 - "$GOOD" <<'PY'
          import sys
          blob = open(sys.argv[1], 'rb').read()
          pos = blob.find(b'\x7fELF')
          assert pos > 0
          open('bare_elf.bin', 'wb').write(blob[pos:])
          PY
          if "$INS" bare_elf.bin >/dev/null 2>&1; then
            echo "FAIL: 裸 ELF 不应 GOOD"; exit 1
          fi
          # --json 对错误格式会返回 1（表示格式错误），这里只取输出
          fmt=$("$INS" --json bare_elf.bin || true)
          case "$fmt" in
            *'"format": "BARE_ELF"'*) ;;
            *) echo "FAIL: 裸 ELF 格式识别错"; exit 1 ;;
          esac
          echo "PASS: 裸 ELF -> BAD_FORMAT"

          # 3. 日期 + ELF -> DATE+ELF
          python3 - "$GOOD" <<'PY'
          import sys
          blob = open(sys.argv[1], 'rb').read()
          pos = blob.find(b'\x7fELF')
          open('date_elf.bin', 'wb').write(b'20050309' + blob[pos:])
          PY
          if "$INS" date_elf.bin >/dev/null 2>&1; then
            echo "FAIL: 日期+ELF 不应 GOOD"; exit 1
          fi
          fmt=$("$INS" --json date_elf.bin || true)
          case "$fmt" in
            *'"format": "DATE+ELF"'*) ;;
            *) echo "FAIL: 日期+ELF 识别错"; exit 1 ;;
          esac
          echo "PASS: 日期+ELF -> BAD_FORMAT"

          # 4. beef 头
          printf '\xbe\xef0000rest' > beef.bin
          fmt=$("$INS" --json beef.bin || true)
          case "$fmt" in
            *'"format": "BEEF"'*) ;;
            *) echo "FAIL: beef 识别错"; exit 1 ;;
          esac
          echo "PASS: beef -> BAD_FORMAT"

          # 5. 不存在的文件 -> exit 2
          set +e
          "$INS" nosuch.dl >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" = "2" ] || { echo "FAIL: 应返回 2，实际 $rc"; exit 1; }
          echo "PASS: 不存在 -> exit 2"

          # 6. 正确固件的关键字段
          fmt=$("$INS" --json correct.dl || true)
          case "$fmt" in
            *'"format": "ACL/PJL"'*) ;;
            *) echo "FAIL: ACL/PJL 识别错"; exit 1 ;;
          esac
          case "$fmt" in
            *'"verdict": "GOOD"'*) ;;
            *) echo "FAIL: verdict 错"; exit 1 ;;
          esac
          echo "PASS: ACL/PJL + GOOD"

          echo
          echo "检测器回归测试全部通过"

      - name: Python 3.9 兼容性
        run: |
          set -euo pipefail
          # macOS 系统 Python 是 3.9，必须兼容
          python3 -m py_compile scripts/hp1020-fwinspect
          echo "语法通过"
          # 确认没有 3.10+ 才有的类型注解写法
          if grep -nE ':\s*(str|int|dict|list|tuple|bool)\s*\|\s*None|->\s*(str|int|dict|list|tuple|bool)\s*\|' \
               scripts/hp1020-fwinspect; then
            echo "FAIL: 存在 Python 3.10+ 才支持的类型注解写法"
            exit 1
          fi
          echo "3.9 兼容性通过"

  lint-scripts:
    name: 脚本语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash 语法
        run: |
          set -euo pipefail
          for f in install.sh fetch-vendor.sh scripts/hp1020-print; do
            echo "检查 $f"
            bash -n "$f"
          done
          echo "全部通过"

      - name: 可执行位
        run: |
          set -euo pipefail
          for f in install.sh fetch-vendor.sh scripts/hp1020-print \
                   scripts/hp1020-fwinspect scripts/selfcheck.sh bin/hp1020_usb; do
            [ -x "$f" ] || { echo "$f 缺少可执行权限"; exit 1; }
          done
          echo "权限正确"

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # 只报错误级问题，警告不阻断
          shellcheck -S error install.sh fetch-vendor.sh \
                     scripts/hp1020-print scripts/selfcheck.sh
          echo "shellcheck 通过"

      - name: Makefile 目标完整性
        run: |
          set -euo pipefail
          for t in build universal check vendor install test clean help; do
            grep -qE "^$t:" Makefile || { echo "FAIL: 缺少目标 $t"; exit 1; }
          done
          echo "PASS: Makefile 目标齐全"
          make help

      - name: 本地自检脚本
        run: |
          # selfcheck 在 Linux 下应同样通过（不含编译步骤）
          bash scripts/selfcheck.sh

  # ---------------------------------------------------------------------------
  # ObjC 源码静态检查 —— 语法层面用 clang 前端解析（不需要 macOS SDK）
  # ---------------------------------------------------------------------------
  check-objc:
    name: ObjC 源码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查源码结构
        run: |
          set -euo pipefail
          SRC=src/hp1020_usb.m
          [ -f "$SRC" ] || { echo "缺少 $SRC"; exit 1; }

          # 必须定义正确的 VID/PID
          grep -q 'define HP_VID 0x03f0' "$SRC" || {
            echo "FAIL: VID 应为 0x03f0"; exit 1; }
          grep -q 'define HP_PID 0x2b17' "$SRC" || {
            echo "FAIL: PID 应为 0x2b17"; exit 1; }
          echo "PASS: VID/PID 正确"

          # 必须检查精确固件版本，而不是见到 FWVER 就算数
          grep -q 'FWVER:20080222' "$SRC" || {
            echo "FAIL: 缺少精确版本判定"; exit 1; }
          echo "PASS: 精确版本判定存在"

          # 必须用 IOUSBHostInterface 枚举（不能用 IOServiceMatching 字典过滤）
          grep -q 'IOUSBHostInterface' "$SRC" || {
            echo "FAIL: 应枚举 IOUSBHostInterface"; exit 1; }
          echo "PASS: 接口枚举方式正确"

      - name: 括号与基本结构
        run: |
          set -euo pipefail
          SRC=src/hp1020_usb.m
          python3 - "$SRC" <<'PY'
          import sys
          src = open(sys.argv[1]).read()
          # 括号平衡
          for op, cl, name in [('{','}','花括号'), ('(',')','圆括号'), ('[',']','方括号')]:
              if src.count(op) != src.count(cl):
                  print(f"FAIL: {name}不平衡 {src.count(op)} vs {src.count(cl)}")
                  sys.exit(1)
          # 必须有 main 函数
          if 'int main(' not in src:
              print("FAIL: 缺少 main")
              sys.exit(1)
          print("PASS: 结构完整")
          PY

  # ---------------------------------------------------------------------------
  # 汇总
  # ---------------------------------------------------------------------------
  all-green:
    name: 全部检查通过
    needs: [verify-firmware, test-inspector, lint-scripts, check-objc]
    runs-on: ubuntu-latest
    steps:
      - run: echo "所有检查作业成功"
